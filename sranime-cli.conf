# sranime-cli configuration file (v5.8.0)
# Place this file in ~/.config/sranime-cli/sranime-cli.conf
# or /etc/sranime-cli/sranime-cli.conf

# Preferred stream provider: hianime, allanime, gogo
# active_provider="hianime"

# Preferred audio mode: sub or dub
# mode="sub"

# Default video quality: best, 1080p, 720p, 480p, 360p, worst
# quality="best"

# Default download directory
# download_dir="$HOME/Downloads"

# Preferred video player (e.g. mpv, vlc, iina)
# player="mpv"

# Extra arguments passed to the media player
# player_extra_flags=""

# Interactive menu program: fzf, rofi, dmenu
# menu_program="fzf"

# Extra arguments passed to the menu program
# menu_extra_flags=""

# Enable or disable rich terminal preview pane in fzf (1 or 0)
# enable_preview=1

# Automatically skip intros with ani-skip (external tool) (mpv only, 1 or 0)
# skip_intro=0

# Log watched episodes to system logger (1 or 0)
# log_episode=1

# Automatically scrobble watched episodes to AniList at 80% completion (1 or 0)
# auto_scrobble=1

# Automatically play subsequent episodes continuously (1 or 0)
# autoplay=0

# Limit consecutive autoplay binge episodes (0 for unlimited)
# autoplay_limit=0

# Automatically resume from saved timestamp checkpoints (1 or 0)
# auto_resume=0

# Generate Jellyfin, Plex & Kodi .nfo metadata and download artwork (1 or 0)
# enable_nfo=0

# Extract and save external subtitle sidecars (.vtt/.srt) during download (1 or 0)
# save_subs=0

# Enable Discord Rich Presence (1 or 0)
# enable_discord_rpc=1

# Default Syncplay room name
# syncplay_room="WatchParty"
