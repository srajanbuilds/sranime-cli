name: 'sranime-cli checks'
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "sranime-cli"
      - "lib/**"
      - "test/**"

jobs:
  sh-checker:
    name: Shellcheck + Shfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Run the sh-checker
      uses: luizm/action-sh-checker@master
      env:
        SHELLCHECK_OPTS: -s sh -o all -e 2250
        SHFMT_OPTS: -i 4 -ci -d
      with:
        sh_checker_exclude: "_sranime-cli-bash _sranime-cli-zsh completions/sranime-cli.bash completions/_sranime-cli"
      
  check-exec:
    name: Executable Bit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: test exec bit
      run: test -x "./sranime-cli"

  check-no-awk:
    name: No Awk Allowed
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: verify that noone added awk
      run: '! grep awk "./sranime-cli"'

  check-no-wget:
    name: No Wget Allowed
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: verify that noone added wget
      run: '! grep wget "./sranime-cli"'

  smoke-test-unix:
    name: Smoke Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v7
    - name: Run smoke tests
      run: sh test/smoke_test.sh

  smoke-test-windows:
    name: Smoke Tests (windows-latest)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run smoke tests in Git Bash
      shell: bash
      run: sh test/smoke_test.sh
