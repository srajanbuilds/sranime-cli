name: 'sranime-cli checks'
on:
  pull_request:
    paths: 
      - "sranime-cli"
      
jobs:
  version-bump:
    name: Version Bump
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: check version bump
      run: git diff origin/main | grep version_number
